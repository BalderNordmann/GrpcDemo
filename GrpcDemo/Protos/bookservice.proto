syntax = "proto3";
import "google/protobuf/empty.proto";
option csharp_namespace = "GrpcServer";

package bookservice;

service BookService {
  rpc GetBookInfo (BookLookupModel) returns (BookModel);
  rpc GetAllBooks (GetAllBooksRequest) returns (stream BookModel);
  rpc UpdateBookInfo (BookLookupModelUpdate) returns (google.protobuf.Empty);
}

message GetAllBooksRequest {
}

message BookLookupModel {
  int32 bookID = 1;
}

message BookLookupModelUpdate {
  int32 bookID = 1;
  int32 bookInStock = 2;
  int32 bookStatus = 3;
}

enum BookCategory{
	HistoricalFiction = 0;
	Fantasy = 1;
	GraphicNovel = 2;
	ShortStory = 3;
	YoungAdult = 4;
	MagicalRealism = 5;
	FairyTale = 6;
	WesternFiction = 7;
	Horror = 8;
	Memoir = 9;
	LiteraryFiction = 10;
	Thriller = 11;
	AdventureFiction = 12;
	ChildrensLiterature = 13;
	WomansFiction = 14;
	Biography = 15;
	ScienceFiction = 16;
	Mystery = 17;
	Romance = 18;
	ContemporaryLiterature = 19;
	DystopianFiction = 20;
	Classics = 21;
	Suspense = 22;	
	Satire = 23;
}

enum BookStatus{
	InStock = 0;
	Ordered = 1;
	NotAvailable = 2;	
}

message BookModel {
  int32 bookID = 1;
  string title = 2;
  string author = 3;
  float price = 4;
  optional BookStatus bookStatus = 5;
  optional BookCategory bookCategory = 6;
  int32 bookInStock = 7;
}